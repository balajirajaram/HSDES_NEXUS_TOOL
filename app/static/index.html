<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto HSD Analyser (Server Platforms)</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Auto HSD Analyser <span class="scope">Intel Server Platforms — any domain</span></h1>
      <div id="account" class="account">
        <span id="account-name" class="hint">Kerberos SSO</span>
      </div>
    </div>
    <div id="status" class="status-bar">
      <span class="badge" id="badge-mode">mode: …</span>
      <span class="badge" id="badge-auth">auth: …</span>
      <span class="badge" id="badge-llm">LLM: …</span>
      <span class="badge" id="badge-kb">KB: … entries</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="analyse">Analyse</button>
    <button class="tab" data-tab="kb">Knowledge Base</button>
  </nav>

  <main>
    <section id="tab-analyse" class="panel active">
      <form id="analyse-form">
        <label>
          HSD ID
          <input id="hsd_id" type="text" placeholder="e.g. 1234567890" required />
        </label>
        <label>
          Symptoms / failure signature
          <textarea id="symptoms" rows="4" required
            placeholder="e.g. system hung after UPI degradation; or: Windows 11 fails to enter S4 during DPMO"></textarea>
        </label>
        <label>
          Attached log (optional) — paste serial / PythonSV / BMC SEL / kernel / RPT
          <textarea id="log_text" rows="5"
            placeholder="Paste log text here, or choose a file below. The tool scans it for MCE/CATERR/UPI/DDR/PCIe/boot-hang signatures."></textarea>
        </label>
        <label class="file-row">
          <input id="log_file" type="file" accept=".txt,.log,.rpt,.out,.csv" />
          <span class="hint">Load a log file into the box above (kept in your browser).</span>
        </label>
        <label class="file-row">
          <input id="fetch_attachments" type="checkbox" />
          <span class="hint">Auto-fetch &amp; analyze logs already attached to the ticket (downloads from HSDES).</span>
        </label>
        <button type="submit" id="run-btn">Analyse</button>
      </form>

      <div id="meta" class="meta hidden"></div>
      <div id="report" class="report"></div>
    </section>

    <section id="tab-kb" class="panel">
      <button id="refresh-kb">Refresh</button>
      <div id="kb-list" class="kb-list"></div>
    </section>
  </main>

  <footer>Intel Internal Use Only — credentials are used only to authenticate to HSDES for your session.</footer>

  <script src="/static/app.js"></script>
</body>
</html>
